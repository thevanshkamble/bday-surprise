<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Live Stage 🎸✨</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030712;
      --card-glass: rgba(15, 23, 42, 0.75);
      --neon-cyan: #38bdf8;
      --neon-blue: #6366f1;
      --accent-pink: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: #030712;
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(56, 189, 248, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(244, 63, 94, 0.15) 0px, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: var(--text-main);
      padding: 12px;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .mobile-app-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 390px;
      background: var(--card-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 20px 16px;
      box-shadow: 
        0 0 50px rgba(56, 189, 248, 0.15),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
      text-align: center;
      animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-pink);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-pink);
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; transform: scale(1.2); }
    }

    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* Mobile Video Framing */
    .video-card-container {
      position: relative;
      border-radius: 24px;
      padding: 3px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.6), rgba(99, 102, 241, 0.2), rgba(244, 63, 94, 0.5));
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
    }

    .video-frame {
      position: relative;
      width: 100%;
      border-radius: 21px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 9/16;
      max-height: 52vh;
      margin: 0 auto;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Equalizer Overlay */
    .equalizer-bar-container {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 18px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 5;
    }

    .eq-bar {
      width: 3px;
      height: 4px;
      background: var(--neon-cyan);
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .playing .eq-bar {
      animation: eqBounce 0.6s infinite alternate ease-in-out;
    }

    .playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .eq-bar:nth-child(2) { animation-delay: 0.3s; }
    .playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .eq-bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes eqBounce {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    .caption-pill {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #e2e8f0;
      line-height: 1.4;
    }

    .status-msg {
      font-size: 0.78rem;
      color: var(--neon-cyan);
      margin: 10px 0 6px;
      font-weight: 500;
      min-height: 18px;
    }

    /* Next Button */
    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3);
      letter-spacing: 0.3px;
    }

    .action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.5);
    }

    .action-btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.25);
      box-shadow: none;
      cursor: not-allowed;
    }

    .lock-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="mobile-app-card">
    <div class="header-badge">
      <span class="live-dot"></span> Private Concert
    </div>
    
    <h2>Just For You 🎸</h2>
    <p class="subtitle">Ek chota sa song, straight from the heart!</p>

    <!-- Video Framing -->
    <div class="video-card-container" id="card-frame">
      <div class="video-frame" id="video-frame">
        <video id="guitar-video" controls controlsList="nodownload" playsinline poster="guitar_thumbnail.jpg">
          <source src="page5.mp3" type="video/mp4">
          Your browser does not support video playback.
        </video>

        <!-- Dynamic EQ Bars -->
        <div class="equalizer-bar-container">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
      </div>
    </div>

    <div class="caption-pill">
      "Thodi si galtiyan ho sakti hain, par emotion 100% real hai!" 🎶💙
    </div>

    <div class="status-msg" id="status-text">▶️ Tap video to play</div>

    <!-- Next Button -->
    <button id="next-btn" class="action-btn" onclick="goToNextPage()" disabled>
      Final Surprise ➔
    </button>
    <div id="lock-hint" class="lock-hint">🔒 Video poori dekhne ke baad button unlock hoga!</div>
  </div>

  <script>
    const SUPABASE_URL = "https://itzmukwiypxwliukfsje.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Bg3tHHTwjNIdr0n3GCsImw_usmCiUVn"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function sendLog(event, details) {
      try {
        await supabaseClient.from('logs').insert([{ event, details }]);
      } catch (err) { console.log(err); }
    }

    const video = document.getElementById('guitar-video');
    const videoFrame = document.getElementById('video-frame');
    const statusText = document.getElementById('status-text');
    const nextBtn = document.getElementById('next-btn');
    const lockHint = document.getElementById('lock-hint');

    video.addEventListener('play', () => {
      videoFrame.classList.add('playing');
      statusText.innerText = "🎸 Playing concert video... Enjoy!";
      sendLog("Page 5 Video", "Started playing guitar video");
    });

    video.addEventListener('pause', () => {
      if (!video.ended) {
        videoFrame.classList.remove('playing');
        statusText.innerText = "⏸️ Video Paused";
        sendLog("Page 5 Video", "Paused video");
      }
    });

    video.addEventListener('ended', () => {
      videoFrame.classList.remove('playing');
      statusText.innerText = "🎉 Unlocked! Tap below for Final Surprise";
      nextBtn.disabled = false;
      lockHint.style.display = "none";
      sendLog("Page 5 Video", "Finished video -> Final Unlocked");
      
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.7 },
        colors: ['#38bdf8', '#6366f1', '#f43f5e', '#ffffff']
      });
    });

    function goToNextPage() {
      if (!nextBtn.disabled) {
        sendLog("Navigation", "Page 5 Completed -> Moving to Final Page");
        window.location.href = "page6.html";
      }
    }

    /* Ambient Floating Floating Particle Canvas */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const elements = [];
    const symbols = ['🎸', '🎵', '🎶', '✨', '💙', '💫'];

    class FloatingItem {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 30;
        this.size = Math.random() * 16 + 14;
        this.speedY = Math.random() * 0.8 + 0.4;
        this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.y -= this.speedY;
        this.x += Math.sin(this.y * 0.01) * 0.8;
        if (this.y < -30) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px sans-serif`;
        ctx.fillText(this.symbol, this.x, this.y);
        ctx.restore();
      }
    }

    for (let i = 0; i < 30; i++) elements.push(new FloatingItem());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      elements.forEach(el => { el.update(); el.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
