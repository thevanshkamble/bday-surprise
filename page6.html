<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Moments & Birthday Reveal 🎂✨</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030712;
      --card-glass: rgba(15, 23, 42, 0.85);
      --neon-cyan: #38bdf8;
      --neon-pink: #f43f5e;
      --neon-purple: #a855f7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #030712;
      background-image: 
        radial-gradient(at 20% 15%, rgba(168, 85, 247, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(56, 189, 248, 0.25) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(244, 63, 94, 0.25) 0px, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: var(--text-main);
      padding: 14px;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .main-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 390px;
      background: var(--card-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.25);
      text-align: center;
      animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 20%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    /* Aesthetic Audio Disc Player */
    .audio-container {
      position: relative;
      border-radius: 24px;
      padding: 20px;
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.15), rgba(56, 189, 248, 0.1));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .vinyl-disc {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 25%, #0f172a 60%, #020617 100%);
      border: 4px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: all 0.5s ease;
    }

    .vinyl-disc.playing {
      animation: spinDisc 4s linear infinite;
      box-shadow: 0 0 35px rgba(244, 63, 94, 0.5);
      border-color: var(--neon-pink);
    }

    @keyframes spinDisc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .disc-center {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      border-radius: 50%;
      border: 3px solid #030712;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 12px;
      outline: none;
    }

    /* Start Button initially hidden */
    .start-btn {
      display: none;
      width: 100%;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 25px rgba(244, 63, 94, 0.4);
      letter-spacing: 0.5px;
      animation: fadeInBtn 0.6s ease forwards;
    }

    @keyframes fadeInBtn {
      0% { opacity: 0; transform: translateY(10px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 12px 30px rgba(244, 63, 94, 0.6);
    }

    .lock-text {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 6px;
    }

    /* Timer Container */
    .timer-container {
      display: none;
      margin-top: 10px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .timer-circle {
      font-family: 'Outfit', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 20px var(--neon-cyan);
      line-height: 1;
      margin-bottom: 4px;
      animation: pulseText 1s infinite alternate;
    }

    @keyframes pulseText {
      0% { transform: scale(0.96); opacity: 0.8; }
      100% { transform: scale(1.04); opacity: 1; }
    }

    .timer-label {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* Grand Birthday Reveal Card */
    .bday-reveal-card {
      display: none;
      margin-top: 15px;
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(168, 85, 247, 0.25));
      border: 1.5px solid rgba(244, 63, 94, 0.6);
      border-radius: 26px;
      padding: 24px 18px;
      box-shadow: 0 0 40px rgba(244, 63, 94, 0.35), inset 0 0 15px rgba(255, 255, 255, 0.05);
      animation: grandReveal 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      position: relative;
      overflow: hidden;
    }

    @keyframes grandReveal {
      0% { opacity: 0; transform: scale(0.85) translateY(15px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .bday-title-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .bday-title {
      font-family: 'Sacramento', cursive;
      font-size: 3.2rem;
      background: linear-gradient(135deg, #ffffff 30%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(244, 63, 94, 0.6);
      line-height: 1;
    }

    .cake-badge {
      font-size: 2.8rem;
      filter: drop-shadow(0 0 12px var(--neon-pink));
      animation: floatCake 2s ease-in-out infinite alternate;
      margin-bottom: 2px;
    }

    @keyframes floatCake {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(1.08); }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="main-card">
    <div class="badge">📸 Time Capsule</div>
    <h2>Our Moments ✨</h2>
    <p class="subtitle" id="subtitle-text">🎧 Pehle poori voice note sunein...</p>

    <!-- Aesthetic Audio Section -->
    <div class="audio-container">
      <div class="vinyl-disc" id="vinyl-disc">
        <div class="disc-center">🎵</div>
      </div>
      
      <!-- Updated Audio Source Path -->
      <audio id="memory-audio" controls controlsList="nodownload">
        <source src="hello.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </div>

    <!-- Hidden until voice note finishes -->
    <button id="start-btn" class="start-btn" onclick="startExperience()">
      Start Timer ⏱
    </button>
    <div id="lock-hint" class="lock-text">🔒 Voice note poori hone ke baad button yahan dikhega!</div>

    <!-- 10 Sec Countdown Timer Box -->
    <div id="timer-box" class="timer-container">
      <div class="timer-circle" id="timer-num">10</div>
      <div class="timer-label">⏳ Reliving our special moments...</div>
    </div>

    <!-- Redesigned Grand Happy Birthday Reveal -->
    <div id="bday-card" class="bday-reveal-card">
      <div class="bday-title-wrapper">
        <div class="cake-badge">🎂</div>
        <div class="bday-title">Happy Birthday!</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://itzmukwiypxwliukfsje.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Bg3tHHTwjNIdr0n3GCsImw_usmCiUVn"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function sendLog(event, details) {
      try {
        await supabaseClient.from('logs').insert([{ event, details }]);
      } catch (err) { console.log(err); }
    }

    const startBtn = document.getElementById('start-btn');
    const lockHint = document.getElementById('lock-hint');
    const subtitleText = document.getElementById('subtitle-text');
    const timerBox = document.getElementById('timer-box');
    const timerNum = document.getElementById('timer-num');
    const bdayCard = document.getElementById('bday-card');
    const memoryAudio = document.getElementById('memory-audio');
    const vinylDisc = document.getElementById('vinyl-disc');

    memoryAudio.addEventListener('play', () => {
      vinylDisc.classList.add('playing');
      sendLog("Page 6 Experience", "Audio Started Playing");
    });

    memoryAudio.addEventListener('pause', () => {
      if (!memoryAudio.ended) {
        vinylDisc.classList.remove('playing');
      }
    });

    // Voice note complete hone par button VISIBLE aur CLICKABLE hoga
    memoryAudio.addEventListener('ended', () => {
      vinylDisc.classList.remove('playing');
      
      // Show button
      startBtn.style.display = "block";
      lockHint.style.display = "none";
      subtitleText.innerText = "✨ Ab niche diye gaye button par click karein!";

      sendLog("Page 6 Experience", "Audio Finished -> Start Timer Button Became Visible!");
    });

    function startExperience() {
      startBtn.style.display = "none";
      timerBox.style.display = "block";
      
      sendLog("Page 6 Experience", "User clicked Start Timer");

      let timeLeft = 10;
      timerNum.innerText = timeLeft;

      const countdown = setInterval(() => {
        timeLeft--;
        timerNum.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerBox.style.display = "none";
          revealBirthday();
        }
      }, 1000);
    }

    function revealBirthday() {
      bdayCard.style.display = "block";
      sendLog("Page 6 Experience", "10s Timer Finished -> Birthday Revealed!");

      // Grand Birthday Confetti Blast
      const duration = 3.5 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 35, spread: 360, ticks: 70, zIndex: 99 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        const particleCount = 60 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    /* Dynamic Sparkle Floating Canvas */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    const items = ['✨', '💖', '🎂', '🎉', '🌟', '💫', '🎈'];

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 16 + 12;
        this.speedY = Math.random() * 0.9 + 0.4;
        this.symbol = items[Math.floor(Math.random() * items.length)];
        this.opacity = Math.random() * 0.6 + 0.2;
      }
      update() {
        this.y -= this.speedY;
        this.x += Math.sin(this.y * 0.01) * 0.7;
        if (this.y < -30) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px sans-serif`;
        ctx.fillText(this.symbol, this.x, this.y);
        ctx.restore();
      }
    }

    for (let i = 0; i < 35; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
