<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Site - Live Activity Logs 📊</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e2e8f0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.6rem;
      color: #ff75a0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .refresh-btn {
      background: linear-gradient(135deg, #f72585, #7209b7);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(247, 37, 133, 0.4);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      transition: background 0.3s;
    }

    .log-card:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .log-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-type {
      font-weight: 600;
      font-size: 0.95rem;
      color: #f8fafc;
    }

    .event-details {
      font-size: 0.88rem;
      color: #cbd5e1;
    }

    .timestamp {
      font-size: 0.75rem;
      color: #64748b;
    }

    /* COLOR BADGES */
    .badge {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Green Badge for Correct Answer & Next Page */
    .badge-pass {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    /* Red Badge for Wrong Answer */
    .badge-fail {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    /* Blue Badge for Clicks & System Open */
    .badge-info {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Activity Tracker 🕵️‍♂️</h1>
      <button class="refresh-btn" onclick="fetchLogs()">🔄 Refresh</button>
    </header>

    <div id="logs-container" class="log-list">
      <div class="loading">Logs load ho rahe hain...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://itzmukwiypxwliukfsje.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Bg3tHHTwjNIdr0n3GCsImw_usmC1_KEY_HERE"; // Apni exact publishable key paste karein
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchLogs() {
      const container = document.getElementById('logs-container');
      container.innerHTML = '<div class="loading">Logs load ho rahe hain...</div>';

      try {
        const { data, error } = await supabaseClient
          .from('logs')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="loading">Koi activity record nahi hui abhi tak!</div>';
          return;
        }

        container.innerHTML = '';
        data.forEach(log => {
          const card = document.createElement('div');
          card.className = 'log-card';

          let badgeClass = 'badge-info';
          let statusText = 'CLICKED';

          const detailsUpper = (log.details || '').toUpperCase();
          const eventUpper = (log.event || '').toUpperCase();

          // Green status logic (Sahi Answer / Next Page Unlocked)
          if (detailsUpper.includes('PASSED') || detailsUpper.includes('UNLOCKED')) {
            badgeClass = 'badge-pass';
            statusText = '✅ CORRECT / NEXT PAGE';
          } 
          // Red status logic (Galat Answer)
          else if (detailsUpper.includes('FAILED') || detailsUpper.includes('WRONG')) {
            badgeClass = 'badge-fail';
            statusText = '❌ WRONG ANSWER';
          } 
          // Default Blue info
          else if (eventUpper.includes('SYSTEM')) {
            statusText = '🌐 SITE OPENED';
          }

          const formattedTime = new Date(log.created_at).toLocaleString();

          card.innerHTML = `
            <div class="log-info">
              <div class="event-type">${log.event || 'User Action'}</div>
              <div class="event-details">${log.details || 'No details'}</div>
              <div class="timestamp">🕒 ${formattedTime}</div>
            </div>
            <div class="badge ${badgeClass}">${statusText}</div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<div class="loading" style="color: #f87171;">Error loading logs: ${err.message}</div>`;
      }
    }

    // Auto load logs when page opens
    fetchLogs();
  </script>
</body>
</html>
