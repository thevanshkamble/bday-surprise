<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Site - Live Activity Logs 📊</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e2e8f0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.6rem;
      color: #ff75a0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      transition: background 0.3s, transform 0.2s;
    }

    .log-card.new-entry {
      animation: highlight 1.5s ease-out;
    }

    @keyframes highlight {
      0% { background: rgba(247, 37, 133, 0.3); transform: scale(1.02); }
      100% { background: rgba(255, 255, 255, 0.03); transform: scale(1); }
    }

    .log-card:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .log-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-type {
      font-weight: 600;
      font-size: 0.95rem;
      color: #f8fafc;
    }

    .event-details {
      font-size: 0.88rem;
      color: #cbd5e1;
    }

    .timestamp {
      font-size: 0.75rem;
      color: #64748b;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge-pass {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .badge-fail {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .badge-info {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Activity Tracker 🕵️‍♂️</h1>
      <div class="status-indicator">
        <span class="live-dot"></span> Realtime Live
      </div>
    </header>

    <div id="logs-container" class="log-list">
      <div class="loading">Live connection establish ho raha hai...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://itzmukwiypxwliukfsje.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Bg3tHHTwjNIdr0n3GCsImw_usmCiUVn";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function createLogCard(log, isNew = false) {
      const card = document.createElement('div');
      card.className = `log-card ${isNew ? 'new-entry' : ''}`;

      let badgeClass = 'badge-info';
      let statusText = 'CLICKED';

      const detailsUpper = (log.details || '').toUpperCase();
      const eventUpper = (log.event || '').toUpperCase();

      if (detailsUpper.includes('PASSED') || detailsUpper.includes('UNLOCKED')) {
        badgeClass = 'badge-pass';
        statusText = '✅ CORRECT / NEXT PAGE';
      } else if (detailsUpper.includes('FAILED') || detailsUpper.includes('WRONG')) {
        badgeClass = 'badge-fail';
        statusText = '❌ WRONG ANSWER';
      } else if (eventUpper.includes('SYSTEM')) {
        statusText = '🌐 SITE OPENED';
      }

      const formattedTime = new Date(log.created_at || Date.now()).toLocaleString();

      card.innerHTML = `
        <div class="log-info">
          <div class="event-type">${log.event || 'User Action'}</div>
          <div class="event-details">${log.details || 'No details'}</div>
          <div class="timestamp">🕒 ${formattedTime}</div>
        </div>
        <div class="badge ${badgeClass}">${statusText}</div>
      `;
      return card;
    }

    async function fetchInitialLogs() {
      const container = document.getElementById('logs-container');

      try {
        const { data, error } = await supabaseClient
          .from('logs')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        container.innerHTML = '';

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="loading">Abhi tak koi activity record nahi hui hai!</div>';
          return;
        }

        data.forEach(log => {
          container.appendChild(createLogCard(log));
        });

      } catch (err) {
        container.innerHTML = `<div class="loading" style="color: #f87171;">Error loading initial logs: ${err.message}</div>`;
      }
    }

    function subscribeToRealtimeLogs() {
      const container = document.getElementById('logs-container');

      supabaseClient
        .channel('public:logs')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'logs' }, payload => {
          const newLog = payload.new;
          
          const loadingElem = container.querySelector('.loading');
          if (loadingElem) {
            container.innerHTML = '';
          }

          const card = createLogCard(newLog, true);
          container.insertBefore(card, container.firstChild);
        })
        .subscribe();
    }

    fetchInitialLogs();
    subscribeToRealtimeLogs();
  </script>
</body>
</html>
