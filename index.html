<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Dreamscape ✨💖</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-coral: #f72585;
      --deep-purple: #7209b7;
      --bubblegum-cyan: #4cc9f0;
      --card-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 40%, #e0c3fc 80%, #8ec5fc 100%);
      background-size: 200% 200%;
      animation: gradientShift 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: #2d3748;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 2px solid var(--glass-border);
      border-radius: 32px;
      padding: 40px 28px;
      box-shadow: 0 20px 40px rgba(114, 9, 183, 0.15), inset 0 0 25px rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .page { display: none; }
    .page.active { display: block; animation: bounceIn 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55); }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    h1, h2 {
      font-family: 'Fredoka', sans-serif;
      color: var(--deep-purple);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .fancy-font {
      font-family: 'Sacramento', cursive;
      font-size: 3.5rem;
      color: var(--primary-coral);
      text-shadow: 2px 2px 8px rgba(247, 37, 133, 0.25);
    }

    p { margin-bottom: 22px; font-size: 0.95rem; color: #4a5568; font-weight: 500; }

    .options-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }

    .option-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(247, 37, 133, 0.15);
      padding: 15px 20px;
      border-radius: 20px;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--deep-purple);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.04);
    }

    .option-btn:hover {
      background: #ffffff;
      border-color: var(--primary-coral);
      box-shadow: 0 10px 25px rgba(247, 37, 133, 0.25);
      transform: translateY(-4px) scale(1.02);
      color: var(--primary-coral);
    }

    .option-btn:active { transform: translateY(-1px) scale(0.98); }

    .error-msg {
      color: var(--primary-coral);
      font-size: 0.9rem;
      margin-top: 16px;
      min-height: 22px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <!-- Question 1 -->
    <div id="page-q1" class="page active">
      <h2>Security Lock #1 ✨</h2>
      <p>Pehle correct answer do tabhi birthday surprise khulega!</p>
      <h3 style="color: var(--primary-coral); margin-bottom: 15px;">Who is the PM of India?</h3>
      <div class="options-grid">
        <button class="option-btn" onclick="checkQ1('Narendra Modi')">Narendra Modi</button>
        <button class="option-btn" onclick="checkQ1('Jawaharlal Nehru')">Jawaharlal Nehru</button>
        <button class="option-btn" onclick="checkQ1('Rahul Gandhi')">Rahul Gandhi</button>
        <button class="option-btn" onclick="checkQ1('Manmohan Singh')">Manmohan Singh</button>
      </div>
      <div id="err-q1" class="error-msg"></div>
    </div>

    <!-- Question 2 -->
    <div id="page-q2" class="page">
      <h2>Security Lock #2 🌈</h2>
      <p>Final Check: What is the name of our upcoming children?</p>
      <div class="options-grid">
        <button class="option-btn" onclick="checkQ2('Hamod Habibi')">Hamod Habibi</button>
        <button class="option-btn" onclick="checkQ2('Durex Belavita')">Durex Belavita</button>
        <button class="option-btn" onclick="checkQ2('Kama Sutra')">Kama Sutra</button>
        <button class="option-btn" onclick="checkQ2('Bokachoda Suar Ka Bacha')">Bokachoda Suar Ka Bacha</button>
      </div>
      <div id="err-q2" class="error-msg"></div>
    </div>

    <!-- Surprise Unlocked Page -->
    <div id="page-welcome" class="page">
      <h1 class="fancy-font">Happy Birthday My Love! 🎈🎂</h1>
      <p style="font-size: 1.05rem; color: #4a5568;">You unlocked the secret dreamscape vault! ❤️✨</p>
      <p style="font-size: 1.4rem; font-weight: 600; color: var(--primary-coral);">
        I Love You To The Moon & Back! 💕
      </p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://itzmukwiypxwliukfsje.supabase.co";
    const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY_HERE"; // PASTE YOUR PUBLISHABLE KEY HERE
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function sendLog(event, details) {
      try {
        await supabaseClient.from('logs').insert([{ event, details }]);
      } catch (err) { console.log(err); }
    }

    sendLog("System Event", "Sunset Pastel Site Opened");

    function checkQ1(selectedAnswer) {
      sendLog("Q1 Click", `Selected '${selectedAnswer}'`);
      if (selectedAnswer === 'Jawaharlal Nehru') {
        document.getElementById('err-q1').innerText = "";
        sendLog("Q1 Result", "PASSED -> Q2 Unlocked");
        document.getElementById('page-q1').classList.remove('active');
        document.getElementById('page-q2').classList.add('active');
      } else {
        document.getElementById('err-q1').innerText = "Wrong answer baby! Sahi wala select karo 😉";
        sendLog("Q1 Result", "FAILED (Wrong Option)");
      }
    }

    function checkQ2(selectedAnswer) {
      sendLog("Q2 Click", `Selected '${selectedAnswer}'`);
      if (selectedAnswer === 'Durex Belavita') {
        document.getElementById('err-q2').innerText = "";
        sendLog("Q2 Result", "PASSED -> Birthday Vault Unlocked! 🎉");
        document.getElementById('page-q2').classList.remove('active');
        document.getElementById('page-welcome').classList.add('active');
      } else {
        document.getElementById('err-q2').innerText = "Arre galat jawab! Aise kaise? 😜";
        sendLog("Q2 Result", "FAILED (Wrong Option)");
      }
    }

    // Playful Floating Pastel Stars & Bubbles
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const elements = [];
    const symbols = ['✨', '💖', '⭐', '🎈', '☁️', '🌸', '💫'];

    class FloatingPastel {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 22 + 14;
        this.speedY = Math.random() * 1.5 + 0.7;
        this.speedX = Math.sin(Math.random() * Math.PI) * 1.5;
        this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
        this.opacity = Math.random() * 0.8 + 0.2;
      }
      update() {
        this.y -= this.speedY;
        this.x += Math.cos(this.y * 0.02) * 1.2;
        if (this.y < -30) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px serif`;
        ctx.fillText(this.symbol, this.x, this.y);
        ctx.restore();
      }
    }

    for (let i = 0; i < 40; i++) elements.push(new FloatingPastel());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      elements.forEach(el => { el.update(); el.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
